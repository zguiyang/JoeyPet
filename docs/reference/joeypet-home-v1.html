<!DOCTYPE html>
<!-- JoeyPet nest home atmosphere board (accepted direction).
     Product keeps shipped nest/Joey geometry; CTA centred; no beams/lamps —
     daypart palettes + curtain sway only. -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joey 的家 · JoeyPet 主界面 v1</title>
<style>
:root{--ink:#3F3A35;--muted:#6E6459;--sage-deep:#4F6D54}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E9E1D4;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);min-height:100vh;padding:28px 20px 40px}
.page{max-width:1120px;margin:0 auto}
.topbar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;justify-content:center;margin-bottom:18px}
.ctrl{display:flex;align-items:center;gap:8px}
.label{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:rgba(255,255,255,.55);border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;font:inherit;font-size:13px;color:var(--muted);padding:7px 14px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(63,58,53,.14)}
.win{width:100%;max-width:1080px;margin:0 auto;background:#FBF8F2;border-radius:14px;box-shadow:0 12px 32px rgba(63,58,53,.16);overflow:hidden}
.titlebar{height:38px;display:flex;align-items:center;padding:0 14px;position:relative;background:#F1EBDF;border-bottom:1px solid #E4DACB}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights .r{background:#EE6A5E}.lights .y{background:#F4BF4F}.lights .g{background:#61C554}
.wtitle{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:600;color:var(--ink);pointer-events:none}
.gear{margin-left:auto;width:18px;height:18px;color:var(--muted)}

/* ---------- stage ---------- */
.stage-box{position:relative;width:100%;aspect-ratio:1080/680;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1080px;height:680px;transform-origin:0 0;transform:scale(var(--s,1));overflow:hidden;background:var(--wall);color:var(--text)}
.stage svg.room{position:absolute;left:0;top:0;width:1080px;height:680px;display:block}

/* time-of-day palettes: only sky, hills, walls, floor, curtain, outdoor disc and surface tones change */
.stage[data-time="morning"],.mini[data-time="morning"]{--wall:#F6EEE3;--floor:#E3CDB0;--sky:#CFE3E6;--hill:#B9CFC3;--curtain:#E9E2D3;--disc:#FFE7B8;--frame:#8A7A6A;--wood:#B99873;--wood-dk:#9C7B5C;--nest:#D8BE96;--nest-dk:#B89B73;--nest-rim:#EBD6B4;--stars:0;--text:#3F3A35;--text-soft:#6E6459;--chip:rgba(255,255,255,.8);--edge:#3F3A35}
.stage[data-time="day"],.mini[data-time="day"]{--wall:#F8F4EC;--floor:#E6D5BE;--sky:#D9E7E6;--hill:#A9C7B4;--curtain:#E8EDE4;--disc:#FFF1C9;--frame:#8A7A6A;--wood:#B99873;--wood-dk:#9C7B5C;--nest:#D8BE96;--nest-dk:#B89B73;--nest-rim:#E9D3AE;--stars:0;--text:#3F3A35;--text-soft:#6E6459;--chip:rgba(255,255,255,.8);--edge:#3F3A35}
.stage[data-time="dusk"],.mini[data-time="dusk"]{--wall:#F1DCC6;--floor:#D9B994;--sky:#F2C9A0;--hill:#B58E78;--curtain:#E9C9A6;--disc:#F6B27E;--frame:#8A6B57;--wood:#A8805E;--wood-dk:#8A6747;--nest:#CBA883;--nest-dk:#A9865F;--nest-rim:#DDBD98;--stars:0;--text:#3F3A35;--text-soft:#6E5A4C;--chip:rgba(255,246,236,.85);--edge:#3F3A35}
.stage[data-time="night"],.mini[data-time="night"]{--wall:#4A4F5C;--floor:#5A4F49;--sky:#1F2A3F;--hill:#34405A;--curtain:#5B5F6E;--disc:#E9E4D6;--frame:#2E3440;--wood:#7A6553;--wood-dk:#5E4B3D;--nest:#8A7660;--nest-dk:#6E5A47;--nest-rim:#A89478;--stars:1;--text:#F4EEE3;--text-soft:#CFC6B8;--chip:rgba(40,44,56,.85);--edge:#FFF6E6}

/* SVG fills driven by palette variables */
.c-wall{fill:var(--wall)}
.c-floor{fill:var(--floor)}
.c-sky{fill:var(--sky)}
.c-hill{fill:var(--hill)}
.c-curtain{fill:var(--curtain)}
.c-disc{fill:var(--disc)}
.c-frame{fill:var(--frame)}
.c-wood{fill:var(--wood)}
.c-wood-dk{fill:var(--wood-dk)}
.c-nest{fill:var(--nest);stroke:var(--nest-rim);stroke-width:3}
.c-nest-dk{fill:var(--nest-dk)}
.stars{opacity:var(--stars)}
.jo{stroke:var(--edge);stroke-opacity:.3;stroke-width:2.2}
.stage svg.room .c-wall,.stage svg.room .c-floor,.stage svg.room .c-sky,.stage svg.room .c-hill,.stage svg.room .c-curtain,.stage svg.room .c-disc,.stage svg.room .c-frame,.stage svg.room .c-wood,.stage svg.room .c-wood-dk,.stage svg.room .c-nest,.stage svg.room .c-nest-dk{transition:fill .8s ease}
.sway{animation:sway 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.sway.r{animation-delay:-3s}
@keyframes sway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-.8deg)}}

/* HUD: left wall = clock + plant, right wall = frame + welcome, centre = CTA + chip */
.hud{position:absolute}
.hot{position:absolute;cursor:pointer;border-radius:12px}
.hot::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;font-size:12px;background:rgba(63,58,53,.9);color:#FBF8F2;padding:6px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s ease}
.hot:hover::after,.hot:focus-visible::after{opacity:1}
.hot:focus-visible{outline:2px solid var(--sage-deep);outline-offset:3px}
.clock-cap{left:48px;top:232px;width:204px;text-align:center;font-size:12px;line-height:1.6;color:var(--text-soft)}
.fact{background:var(--chip);color:var(--text);font-size:13px;padding:7px 12px;border-radius:10px;white-space:nowrap}
.fact-plant{left:44px;top:336px}
.frame-cap{left:874px;top:272px;width:128px;text-align:center;font-size:12px;color:var(--text-soft)}
.welcome{left:770px;top:330px;width:270px;font-size:17px;line-height:1.7;font-weight:500;color:var(--text)}
.chip{position:absolute;left:540px;top:560px;transform:translateX(-50%);background:var(--chip);color:var(--text);font-size:13px;padding:7px 14px;border-radius:12px;transition:opacity .4s ease;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{font-weight:600;color:var(--sage-deep);margin-left:6px}
.stage:not([data-session="session"]) .chip{opacity:0;pointer-events:none}
.invite{position:absolute;left:170px;top:520px;width:220px;background:#FFFDF8;color:var(--ink);border-radius:6px;padding:14px 14px 12px;font-size:13px;line-height:1.65;box-shadow:0 6px 16px rgba(63,58,53,.18);transform:rotate(-2deg);transition:opacity .4s ease}
.invite p+p{margin-top:6px;font-size:12px;color:var(--muted)}
.stage:not([data-session="invite"]) .invite{opacity:0;pointer-events:none}
.primary{position:absolute;left:540px;top:612px;margin-left:-100px;width:200px;height:48px;border:0;border-radius:16px;background:var(--sage-deep);color:#FBF8F2;font:inherit;font-size:15px;font-weight:600;letter-spacing:.02em;cursor:pointer;box-shadow:0 4px 12px rgba(79,109,84,.24);transition:background .2s ease,transform .1s ease}
.primary:hover{background:#44604a}
.primary:active{transform:translateY(1px)}
.primary:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Joey eye states */
.eyes{transition:opacity .4s ease}
.stage[data-session="session"] .eyes-open,.stage[data-session="quiet"] .eyes-open{opacity:0}
.stage:not([data-session="session"]) .eyes-look{opacity:0}
.stage:not([data-session="quiet"]) .eyes-sleep{opacity:0}

/* controls below stage */
.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
.strip-title{margin:22px 0 10px;text-align:center;font-size:12px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:1080px;margin:0 auto}
.thumb{border:2px solid transparent;background:#FBF8F2;border-radius:12px;padding:6px 6px 8px;cursor:pointer;font:inherit;color:var(--muted);font-size:12px;text-align:left;box-shadow:0 2px 8px rgba(63,58,53,.08)}
.thumb[aria-pressed="true"]{border-color:var(--sage-deep);color:var(--ink)}
.thumb .mini{margin-bottom:6px}
.mini{position:relative;width:100%;aspect-ratio:180/110;border-radius:8px;overflow:hidden;background:var(--wall)}
.mini svg{width:100%;height:100%;display:block}
.mini .sway{animation:none}
@media (max-width:720px){.strip{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.sway{animation:none}.stage,.stage *{transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="ctrl">
      <span class="label">时段</span>
      <div class="seg" id="timeSeg" role="group" aria-label="时段">
        <button type="button" data-time="morning" aria-pressed="false">清晨</button>

        <button type="button" data-session="quiet" aria-pressed="false">安静时段</button>

          <rect class="c-frame" x="530" y="124" width="8" height="262"/>
          <rect class="c-frame" x="394" y="250" width="292" height="8"/>

          <!-- curtains: the only motion, gentle sway -->
          <rect class="c-frame" x="330" y="88" width="420" height="6" rx="3"/>

          <path class="c-curtain sway r" d="M730 96 L676 96 C 688 200 684 320 696 420 L734 420 C 722 320 720 200 730 96 Z"/>

          <rect class="c-sky" x="884" y="156" width="108" height="100" rx="4"/>
          <circle class="c-disc" cx="960" cy="186" r="11"/>
          <path class="c-hill" d="M884 224 C 918 198 950 204 992 220 L992 256 L884 256 Z"/>

          <!-- plant (left, bottom) -->
          <path d="M66 470 C 66 440 80 420 90 404 C 100 420 114 440 114 470 Z" fill="#86A98A"/>
          <path d="M90 404 C 76 396 62 388 56 372 C 72 372 86 384 92 398 Z" fill="#4F6D54" opacity=".85"/>

        <!-- HUD -->

        <ellipse class="c-nest" cx="90" cy="86" rx="30" ry="7"/>
        <ellipse class="jo" cx="82" cy="40" rx="4" ry="11" fill="#F3E3CD" transform="rotate(-8 82 40)"/><ellipse class="jo" cx="98" cy="40" rx="4" ry="11" fill="#F3E3CD" transform="rotate(8 98 40)"/>
        <ellipse class="jo" cx="90" cy="72" rx="15" ry="16" fill="#F3E3CD"/><circle class="jo" cx="90" cy="54" r="12" fill="#F3E3CD"/>

        <rect x="64" y="96" width="52" height="8" rx="4" fill="#4F6D54"/>

    <button type="button" class="thumb" data-session="invite" aria-pressed="false">

        <ellipse class="jo" cx="82" cy="40" rx="4" ry="11" fill="#F3E3CD" transform="rotate(-8 82 40)"/><ellipse class="jo" cx="98" cy="40" rx="4" ry="11" fill="#F3E3CD" transform="rotate(8 98 40)"/>

</div>
<script>
(function(){
  var stage = document.getElementById('stage');
  var box = document.getElementById('stageBox');
  var welcome = document.getElementById('welcome');
  var mainBtn = document.getElementById('mainBtn');
  var timer = document.getElementById('timer');
  var timeBtns = document.querySelectorAll('#timeSeg button');
  var sessBtns = document.querySelectorAll('#sessSeg button');
  var thumbs = document.querySelectorAll('#strip .thumb');

  var WELCOME = {
    morning: '一年之计在于晨。',
    day: '我在这儿陪着你。',
    dusk: '今天够了，慢慢收一收。',
    night: '夜里也安静陪着。'
  };
  var BTN = { idle: '开始一起工作', session: '结束陪伴', invite: '好，去伸个懒腰', quiet: '知道了' };
  var DEFAULT_TIME = { idle: 'day', session: 'day', invite: 'dusk', quiet: 'night' };

  var manualTime = false;
  var sec = 0, ticker = null;

  function autoTime(){
    var h = new Date().getHours();
    if (h >= 5 && h < 10) return 'morning';
    if (h >= 10 && h < 17) return 'day';
    if (h >= 17 && h < 20) return 'dusk';
    return 'night';
  }
  function fmt(n){ var m = Math.floor(n/60), s = n%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }

  function setTime(t, fromUser){
    stage.setAttribute('data-time', t);
    welcome.textContent = WELCOME[t];
    timeBtns.forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.time === t)); });
    if (fromUser) manualTime = true;
  }

  function setSession(s){
    stage.setAttribute('data-session', s);
    mainBtn.textContent = BTN[s];
    sessBtns.forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.session === s)); });
    thumbs.forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.session === s)); });
    if (s === 'session') {
      sec = 0; timer.textContent = fmt(sec);
      clearInterval(ticker);
      ticker = setInterval(function(){ sec++; timer.textContent = fmt(sec); }, 1000);
    } else {
      clearInterval(ticker); ticker = null;
    }
  }

  function fit(){ stage.style.setProperty('--s', box.clientWidth / 1080); }

  timeBtns.forEach(function(b){ b.addEventListener('click', function(){ setTime(b.dataset.time, true); }); });
  sessBtns.forEach(function(b){ b.addEventListener('click', function(){ setSession(b.dataset.session); }); });
  thumbs.forEach(function(b){ b.addEventListener('click', function(){ setSession(b.dataset.session); }); });
  mainBtn.addEventListener('click', function(){
    setSession(stage.getAttribute('data-session') === 'session' ? 'idle' : 'session');
  });

  setTime(autoTime(), false);
  setSession('idle');
  window.addEventListener('resize', fit);
  fit();
  setInterval(function(){ if (!manualTime) setTime(autoTime(), false); }, 60000);
})();
</script>
</body>
</html>
