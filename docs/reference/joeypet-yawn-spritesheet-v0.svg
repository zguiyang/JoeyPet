<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 880" width="880" height="880">
  <defs>
    <!-- Joey yawn parts, sprite coordinates (320 x 400). Source: pose_yawn.svg (base rotate +2 about 160,334). -->
    <g id="yTail">
      <path d="M228 314 C 268 324 294 300 290 272 C 287 250 266 244 256 256 C 248 266 256 280 269 277" fill="none" stroke="#F0DFC8" stroke-width="23" stroke-linecap="round"/>
    </g>
    <g id="yEarL">
      <path d="M118 148 C 100 126 88 90 93 68 C 97 50 116 46 126 62 C 138 80 144 116 146 140 Z" fill="#F3E3CD"/>
      <path d="M120 136 C 108 118 101 94 105 80 C 108 70 117 69 122 78 C 129 90 134 114 136 132 Z" fill="#EFC8AA"/>
    </g>
    <g id="yEarR">
      <path d="M202 148 C 220 126 232 90 227 68 C 223 50 204 46 194 62 C 182 80 176 116 174 140 Z" fill="#F3E3CD"/>
      <path d="M200 136 C 212 118 219 94 215 80 C 212 70 203 69 198 78 C 191 90 186 114 184 132 Z" fill="#EFC8AA"/>
    </g>
    <g id="yBody">
      <ellipse cx="160" cy="352" rx="94" ry="12" fill="#3F3A35" opacity="0.08"/>
      <path d="M160 116 C 209 116 242 167 242 231 C 242 299 208 342 160 342 C 112 342 78 299 78 231 C 78 167 111 116 160 116 Z" fill="#F3E3CD"/>
      <path d="M160 342 C 112 342 78 299 78 231 C 78 224 78 218 79 212 C 93 298 118 322 160 322 C 202 322 227 298 241 212 C 242 218 242 224 242 231 C 242 299 208 342 160 342 Z" fill="#EBD7BE" opacity="0.5"/>
      <ellipse cx="128" cy="337" rx="27" ry="13" fill="#F8ECDA"/>
      <ellipse cx="192" cy="337" rx="27" ry="13" fill="#F8ECDA"/>
      <path d="M122 244 C 142 258 178 258 198 244" fill="none" stroke="#86A98A" stroke-width="9" stroke-linecap="round"/>
      <circle cx="200" cy="247" r="7" fill="#86A98A"/>
      <ellipse cx="84" cy="262" rx="18" ry="28" fill="#EDDAC1" transform="rotate(10 84 262)"/>
      <ellipse cx="236" cy="262" rx="18" ry="28" fill="#EDDAC1" transform="rotate(-10 236 262)"/>
    </g>
    <!-- Face for the yawn: arc eyes squeezed shut, small open mouth (ellipse at 160,232). Blush at 0.34. -->
    <g id="yFace">
      <ellipse cx="111" cy="230" rx="18" ry="9" fill="#EFAE7D" opacity="0.34"/>
      <ellipse cx="209" cy="230" rx="18" ry="9" fill="#EFAE7D" opacity="0.34"/>
      <path d="M124 204 C 130 196 141 196 147 204" fill="none" stroke="#3F3A35" stroke-width="4" stroke-linecap="round"/>
      <path d="M173 204 C 179 196 190 196 196 204" fill="none" stroke="#3F3A35" stroke-width="4" stroke-linecap="round"/>
      <path d="M160 212 C 165 212 168 215 166 218 C 164 220.5 156 220.5 154 218 C 152 215 155 212 160 212 Z" fill="#C98F6E"/>
      <ellipse cx="160" cy="232" rx="13" ry="16" fill="#6F5F53"/>
      <ellipse cx="160" cy="239" rx="8" ry="6.5" fill="#C98F6E"/>
    </g>
  </defs>

  <rect x="0" y="0" width="880" height="880" fill="#F7F3EB"/>

  <!-- One-shot yawn, 4 x 2, frames 01-08 (cell 160 x 200, sprite scale 0.5). Feet pinned at y 352.
       Stages: 01 start, 02 mouth opening, 03-04 peak (extra back-tilt), 05 partly closing, 06 closing, 07 near rest, 08 sit rest.
       Head tilt is applied as a rotation about the feet base (160,352), so the body tips back rather than sliding. -->

  <!-- 01 start: base +2, mouth closed-ish (mouth scaled 0.3) -->
  <g transform="translate(40 40) scale(.5)"><g transform="rotate(2 160 334)"><use href="#yTail"/><use href="#yEarL"/><use href="#yEarR"/><use href="#yBody"/><g transform="translate(160 232) scale(1 0.3) translate(-160 -232)"><use href="#yFace"/></g></g></g>
  <!-- 02 mouth opening: base +2, mouth 0.7 -->
  <g transform="translate(200 40) scale(.5)"><g transform="rotate(2.5 160 334)"><use href="#yTail"/><use href="#yEarL"/><use href="#yEarR"/><use href="#yBody"/><use href="#yFace"/></g></g>
  <!-- 03 peak: base +3.5 (extra back-tilt), mouth full, ears slightly back -->
  <g transform="translate(360 40) scale(.5)"><g transform="rotate(3.5 160 334)"><use href="#yTail"/><g transform="rotate(1 126 148)"><use href="#yEarL"/></g><g transform="rotate(-1 194 148)"><use href="#yEarR"/></g><use href="#yBody"/><use href="#yFace"/></g></g>
  <!-- 04 peak hold: base +3.8, ears back a touch more -->
  <g transform="translate(520 40) scale(.5)"><g transform="rotate(3.8 160 334)"><use href="#yTail"/><g transform="rotate(1.5 126 148)"><use href="#yEarL"/></g><g transform="rotate(-1.5 194 148)"><use href="#yEarR"/></g><use href="#yBody"/><use href="#yFace"/></g></g>
  <!-- 05 start closing: base +3, mouth 0.85 -->
  <g transform="translate(680 40) scale(.5)"><g transform="rotate(3 160 334)"><use href="#yTail"/><g transform="rotate(0.6 126 148)"><use href="#yEarL"/></g><g transform="rotate(-0.6 194 148)"><use href="#yEarR"/></g><use href="#yBody"/><g transform="translate(160 232) scale(1 0.85) translate(-160 -232)"><use href="#yFace"/></g></g></g>
  <!-- 06 closing: base +2.5, mouth 0.55 -->
  <g transform="translate(40 240) scale(.5)"><g transform="rotate(2.5 160 334)"><use href="#yTail"/><use href="#yEarL"/><use href="#yEarR"/><use href="#yBody"/><g transform="translate(160 232) scale(1 0.55) translate(-160 -232)"><use href="#yFace"/></g></g></g>
  <!-- 07 near rest: base +2.1, mouth 0.3 -->
  <g transform="translate(200 240) scale(.5)"><g transform="rotate(2.1 160 334)"><use href="#yTail"/><use href="#yEarL"/><use href="#yEarR"/><use href="#yBody"/><g transform="translate(160 232) scale(1 0.3) translate(-160 -232)"><use href="#yFace"/></g></g></g>
  <!-- 08 sit rest: base +2 with closed mouth (small line only), returns to sit-ready state -->
  <g transform="translate(360 240) scale(.5)"><g transform="rotate(2 160 334)"><use href="#yTail"/><use href="#yEarL"/><use href="#yEarR"/><use href="#yBody"/><g transform="translate(160 232) scale(1 0.12) translate(-160 -232)"><use href="#yFace"/></g></g></g>
</svg>
