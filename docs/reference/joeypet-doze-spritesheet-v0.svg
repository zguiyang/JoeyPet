<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1120" width="880" height="1120">
  <defs>
    <!-- Joey doze parts, sprite coordinates (320 x 400). Source: pose_doze.svg (base rotation -5 deg applied per frame). -->
    <g id="dTail">
      <path d="M228 314 C 268 324 294 300 290 272 C 287 250 266 244 256 256 C 248 266 256 280 269 277" fill="none" stroke="#F0DFC8" stroke-width="23" stroke-linecap="round"/>
    </g>
    <g id="dEarL">
      <path d="M118 148 C 100 126 88 90 93 68 C 97 50 116 46 126 62 C 138 80 144 116 146 140 Z" fill="#F3E3CD"/>
      <path d="M120 136 C 108 118 101 94 105 80 C 108 70 117 69 122 78 C 129 90 134 114 136 132 Z" fill="#EFC8AA"/>
    </g>
    <g id="dEarR">
      <path d="M202 148 C 220 126 232 90 227 68 C 223 50 204 46 194 62 C 182 80 176 116 174 140 Z" fill="#F3E3CD"/>
      <path d="M200 136 C 212 118 219 94 215 80 C 212 70 203 69 198 78 C 191 90 186 114 184 132 Z" fill="#EFC8AA"/>
    </g>
    <g id="dBody">
      <ellipse cx="160" cy="352" rx="94" ry="12" fill="#3F3A35" opacity="0.08"/>
      <path d="M160 116 C 209 116 242 167 242 231 C 242 299 208 342 160 342 C 112 342 78 299 78 231 C 78 167 111 116 160 116 Z" fill="#F3E3CD"/>
      <path d="M160 342 C 112 342 78 299 78 231 C 78 224 78 218 79 212 C 93 298 118 322 160 322 C 202 322 227 298 241 212 C 242 218 242 224 242 231 C 242 299 208 342 160 342 Z" fill="#EBD7BE" opacity="0.5"/>
      <ellipse cx="128" cy="337" rx="27" ry="13" fill="#F8ECDA"/>
      <ellipse cx="192" cy="337" rx="27" ry="13" fill="#F8ECDA"/>
      <path d="M122 244 C 142 258 178 258 198 244" fill="none" stroke="#86A98A" stroke-width="9" stroke-linecap="round"/>
      <circle cx="200" cy="247" r="7" fill="#86A98A"/>
      <ellipse cx="84" cy="262" rx="18" ry="28" fill="#EDDAC1" transform="rotate(10 84 262)"/>
      <ellipse cx="236" cy="262" rx="18" ry="28" fill="#EDDAC1" transform="rotate(-10 236 262)"/>
    </g>
    <g id="dFace">
      <ellipse cx="111" cy="228" rx="17" ry="8" fill="#EFAE7D" opacity="0.2"/>
      <ellipse cx="209" cy="228" rx="17" ry="8" fill="#EFAE7D" opacity="0.2"/>
      <path d="M125 206 C 133 215 143 215 149 206" fill="none" stroke="#3F3A35" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M171 206 C 179 215 189 215 195 206" fill="none" stroke="#3F3A35" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M160 218 C 165 218 168 221 166 224 C 164 226.5 156 226.5 154 224 C 152 221 155 218 160 218 Z" fill="#C98F6E"/>
      <path d="M155 232 C 158 235 162 235 165 232" fill="none" stroke="#6F5F53" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect x="0" y="0" width="880" height="1120" fill="#F7F3EB"/>

  <!-- A. Breathing loop, 5 x 2, frames 01-10 (cell 160 x 200, sprite scale 0.5) -->
  <!-- 01 -->
  <g transform="translate(40 40) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g transform="translate(160 388) rotate(0) scale(1 1.000) translate(-160 -388)"><use href="#dTail" transform="rotate(0 256 286)"/><use href="#dEarL" transform="rotate(0 126 148)"/><use href="#dEarR" transform="rotate(0 194 148)"/><use href="#dBody"/><use href="#dFace" transform="translate(0 0)"/></g></g></g>
  <!-- 02 -->
  <g transform="translate(200 40) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g transform="translate(160 388) rotate(0.7) scale(1 1.007) translate(-160 -388)"><use href="#dTail" transform="rotate(0 256 286)"/><use href="#dEarL" transform="rotate(0.4 126 148)"/><use href="#dEarR" transform="rotate(-0.3 194 148)"/><use href="#dBody"/><use href="#dFace" transform="translate(0 0.5)"/></g></g></g>
  <!-- 03 -->
  <g transform="translate(360 40) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g transform="translate(160 388) rotate(1.1) scale(1 1.011) translate(-160 -388)"><use href="#dTail" transform="rotate(0.6 256 286)"/><use href="#dEarL" transform="rotate(0.8 126 148)"/><use href="#dEarR" transform="rotate(-0.5 194 148)"/><use href="#dBody"/><use href="#dFace" transform="translate(0 1.2)"/></g></g></g>
  <!-- 04 -->
  <g transform="translate(520 40) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g transform="translate(160 388) rotate(1.1) scale(1 1.011) translate(-160 -388)"><use href="#dTail" transform="rotate(0.6 256 286)"/><use href="#dEarL" transform="rotate(0.6 126 148)"/><use href="#dEarR" transform="rotate(-0.3 194 148)"/><use href="#dBody"/><use href="#dFace" transform="translate(0 1.5)"/></g></g></g>
  <!-- 05 -->
  <g transform="translate(680 40) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g transform="translate(160 388) rotate(0.7) scale(1 1.007) translate(-160 -388)"><use href="#dTail" transform="rotate(0 256 286)"/><use href="#dEarL" transform="rotate(0.2 126 148)"/><use href="#dEarR" transform="rotate(0 194 148)"/><use href="#dBody"/><use href="#dFace" transform="translate(0 1.0)"/></g></g></g>
  <!-- 06 -->
  <g transform="translate(40 240) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g transform="translate(160 388) rotate(0) scale(1 1.000) translate(-160 -388)"><use href="#dTail" transform="rotate(0 256 286)"/><use href="#dEarL" transform="rotate(0 126 148)"/><use href="#dEarR" transform="rotate(0.2 194 148)"/><use href="#dBody"/><use href="#dFace" transform="translate(0 0.4)"/></g></g></g>
  <!-- 07 -->
  <g transform="translate(200 240) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g transform="translate(160 388) rotate(-0.7) scale(1 0.993) translate(-160 -388)"><use href="#dTail" transform="rotate(-0.5 256 286)"/><use href="#dEarL" transform="rotate(-0.3 126 148)"/><use href="#dEarR" transform="rotate(0.4 194 148)"/><use href="#dBody"/><use href="#dFace" transform="translate(0 0)"/></g></g></g>
  <!-- 08 -->
  <g transform="translate(360 240) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g transform="translate(160 388) rotate(-1.1) scale(1 0.989) translate(-160 -388)"><use href="#dTail" transform="rotate(-0.5 256 286)"/><use href="#dEarL" transform="rotate(-0.5 126 148)"/><use href="#dEarR" transform="rotate(0.6 194 148)"/><use href="#dBody"/><use href="#dFace" transform="translate(0 0)"/></g></g></g>
  <!-- 09 -->
  <g transform="translate(520 240) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g transform="translate(160 388) rotate(-1.1) scale(1 0.989) translate(-160 -388)"><use href="#dTail" transform="rotate(0 256 286)"/><use href="#dEarL" transform="rotate(-0.3 126 148)"/><use href="#dEarR" transform="rotate(0.4 194 148)"/><use href="#dBody"/><use href="#dFace" transform="translate(0 0)"/></g></g></g>
  <!-- 10 -->
  <g transform="translate(680 240) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g transform="translate(160 388) rotate(-0.7) scale(1 0.993) translate(-160 -388)"><use href="#dTail" transform="rotate(0 256 286)"/><use href="#dEarL" transform="rotate(0 126 148)"/><use href="#dEarR" transform="rotate(0.2 194 148)"/><use href="#dBody"/><use href="#dFace" transform="translate(0 0)"/></g></g></g>

  <!-- B. Occasional short actions, 3 rows x 4 frames (cell 160 x 200). Row 1 ears, row 2 head dip, row 3 tail -->
  <!-- B1 ears: rest -->
  <g transform="translate(120 480) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g><use href="#dTail" transform="rotate(0 256 286)"/><use href="#dEarL" transform="rotate(0 126 148)"/><use href="#dEarR" transform="rotate(0 194 148)"/><use href="#dBody"/><use href="#dFace"/></g></g></g>
  <!-- B1 ears: left -->
  <g transform="translate(280 480) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g><use href="#dTail" transform="rotate(0 256 286)"/><use href="#dEarL" transform="rotate(-2.5 126 148)"/><use href="#dEarR" transform="rotate(-2.5 194 148)"/><use href="#dBody"/><use href="#dFace"/></g></g></g>
  <!-- B1 ears: right -->
  <g transform="translate(440 480) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g><use href="#dTail" transform="rotate(0 256 286)"/><use href="#dEarL" transform="rotate(2.5 126 148)"/><use href="#dEarR" transform="rotate(2.5 194 148)"/><use href="#dBody"/><use href="#dFace"/></g></g></g>
  <!-- B1 ears: back to center -->
  <g transform="translate(600 480) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g><use href="#dTail" transform="rotate(0 256 286)"/><use href="#dEarL" transform="rotate(0 126 148)"/><use href="#dEarR" transform="rotate(0 194 148)"/><use href="#dBody"/><use href="#dFace"/></g></g></g>

  <!-- B2 head dip: rest -->
  <g transform="translate(120 680) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g><use href="#dTail" transform="rotate(0 256 286)"/><use href="#dEarL" transform="rotate(0 126 148)"/><use href="#dEarR" transform="rotate(0 194 148)"/><use href="#dBody"/><use href="#dFace"/></g></g></g>
  <!-- B2 head dip: light -->
  <g transform="translate(280 680) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g><use href="#dTail" transform="rotate(0 256 286)"/><use href="#dEarL" transform="translate(0 0.6) rotate(0 126 148)"/><use href="#dEarR" transform="translate(0 0.6) rotate(0 194 148)"/><use href="#dBody"/><use href="#dFace" transform="translate(0 2.5)"/></g></g></g>
  <!-- B2 head dip: deeper -->
  <g transform="translate(440 680) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g><use href="#dTail" transform="rotate(0 256 286)"/><use href="#dEarL" transform="translate(0 1.0) rotate(0 126 148)"/><use href="#dEarR" transform="translate(0 1.0) rotate(0 194 148)"/><use href="#dBody"/><use href="#dFace" transform="translate(0 4.0)"/></g></g></g>
  <!-- B2 head dip: return -->
  <g transform="translate(600 680) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g><use href="#dTail" transform="rotate(0 256 286)"/><use href="#dEarL" transform="translate(0 0.2) rotate(0 126 148)"/><use href="#dEarR" transform="translate(0 0.2) rotate(0 194 148)"/><use href="#dBody"/><use href="#dFace" transform="translate(0 1.0)"/></g></g></g>

  <!-- B3 tail: rest -->
  <g transform="translate(120 880) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g><use href="#dTail" transform="rotate(0 256 286)"/><use href="#dEarL" transform="rotate(0 126 148)"/><use href="#dEarR" transform="rotate(0 194 148)"/><use href="#dBody"/><use href="#dFace"/></g></g></g>
  <!-- B3 tail: small flick -->
  <g transform="translate(280 880) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g><use href="#dTail" transform="rotate(3 256 286)"/><use href="#dEarL" transform="rotate(0 126 148)"/><use href="#dEarR" transform="rotate(0 194 148)"/><use href="#dBody"/><use href="#dFace"/></g></g></g>
  <!-- B3 tail: settle -->
  <g transform="translate(440 880) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g><use href="#dTail" transform="rotate(1 256 286)"/><use href="#dEarL" transform="rotate(0 126 148)"/><use href="#dEarR" transform="rotate(0 194 148)"/><use href="#dBody"/><use href="#dFace"/></g></g></g>
  <!-- B3 tail: rest -->
  <g transform="translate(600 880) scale(.5)"><g transform="rotate(-5 160 344) translate(0 6)"><g><use href="#dTail" transform="rotate(0 256 286)"/><use href="#dEarL" transform="rotate(0 126 148)"/><use href="#dEarR" transform="rotate(0 194 148)"/><use href="#dBody"/><use href="#dFace"/></g></g></g>
</svg>
