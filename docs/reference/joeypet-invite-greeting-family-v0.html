<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#F7F3EB" />
<title>JoeyPet · 休息邀请与问候 · 视觉家族 v0</title>
<style>
  :root{
    --ivory:#F7F3EB;
    --ivory-2:#F1E9DA;
    --panel:#FFFDF7;
    --panel-2:#F8F3E9;
    --popover:#FFFDF8;
    --ink:#3F3A35;
    --ink-2:#6B6259;
    --muted:#6E6459;
    --sage:#86A98A;
    --sage-deep:#4F6D54;
    --sage-ink:#263227;
    --apricot:#EFAE7D;
    --clay:#C9B08C;
    --hairline:rgba(63,58,53,.14);
    --hairline-strong:rgba(63,58,53,.24);
    --shadow-card:0 12px 30px -14px rgba(63,58,53,.30), 0 2px 6px rgba(63,58,53,.05);
    --shadow-tip:0 6px 16px -8px rgba(63,58,53,.24), 0 1px 3px rgba(63,58,53,.06);
    --font-ui:"PingFang SC","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
  }

  .dusk{
    --ivory:#313A3B;
    --ivory-2:#2C3435;
    --panel:#37403F;
    --panel-2:#2F3838;
    --popover:#394241;
    --ink:#E9E3D7;
    --ink-2:#BFB8AB;
    --muted:#B0A89C;
    --sage-ink:#1E2A20;
    --hairline:rgba(233,227,215,.14);
    --hairline-strong:rgba(233,227,215,.24);
    --shadow-card:0 18px 38px -18px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3);
    --shadow-tip:0 8px 18px -8px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.3);
  }

  *{ box-sizing:border-box; }
  html{ background:var(--ivory); }
  body{
    margin:0;
    min-height:100vh;
    background:var(--ivory);
    color:var(--ink);
    font-family:var(--font-ui);
    font-size:15px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  ::selection{ background:rgba(134,169,138,.26); }

  .board{
    width:min(100%,1180px);
    margin:0 auto;
    padding:52px 32px 64px;
  }

  .eyebrow{
    display:flex; align-items:center; gap:11px;
    margin:0 0 18px;
    color:var(--sage-deep);
    font-family:var(--font-mono);
    font-size:11px; font-weight:600;
    letter-spacing:.14em; text-transform:uppercase;
  }
  .eyebrow::before{ content:""; width:26px; height:1px; background:var(--sage); }

  h1{
    margin:0 0 14px;
    font-size:clamp(30px,3.6vw,42px);
    line-height:1.34;
    font-weight:600;
    letter-spacing:0;
    text-wrap:balance;
  }
  .dek{
    max-width:60ch;
    margin:0 0 22px;
    color:var(--ink-2);
    font-size:15px;
    line-height:1.78;
  }
  .keyline{
    display:flex; flex-wrap:wrap; gap:8px 18px;
    margin:0 0 40px; padding:14px 0 0;
    border-top:1px solid var(--hairline);
    list-style:none;
  }
  .keyline li{
    display:flex; align-items:baseline; gap:7px;
    color:var(--muted); font-size:12px;
  }
  .keyline b{
    font-family:var(--font-mono); font-weight:600; font-size:11px;
    color:var(--ink-2); letter-spacing:.02em;
  }

  .frames{ display:flex; flex-direction:column; gap:22px; }

  .frame{
    margin:0;
    padding:18px;
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:16px;
  }
  .frame-head{
    display:flex; align-items:baseline; gap:12px;
    margin:0 4px 14px;
  }
  .frame-no{
    font-family:var(--font-mono); font-size:11px; font-weight:600;
    letter-spacing:.08em; color:var(--sage-deep);
  }
  .frame-title{ font-size:15px; font-weight:600; color:var(--ink); }
  .frame-note{ margin-left:auto; font-size:12px; color:var(--muted); }
  .frame-legend{
    margin:12px 4px 2px;
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:10.5px;
    line-height:1.7;
    letter-spacing:.01em;
  }

  /* ---------- Joey ---------- */
  .joey{ display:block; }
  .joey--desktop{ width:168px; height:210px; }
  .joey--nest{ position:absolute; left:112px; bottom:60px; width:112px; height:140px; z-index:3; }
  .joey--greet{ width:132px; height:165px; }
  .joey--cmp{ width:150px; height:187px; }

  /* ---------- Stage shells ---------- */
  .stage{
    position:relative;
    overflow:hidden;
    background:var(--ivory);
    border:1px solid var(--hairline);
    border-radius:12px;
  }
  .stage--desktop{
    display:flex; align-items:center; justify-content:center;
    min-height:340px; padding:30px 26px;
  }
  .scene-row{
    display:flex; align-items:center; justify-content:center;
    flex-wrap:wrap; gap:30px;
  }

  /* ---------- Invitation card ---------- */
  .invite{
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:17px;
    box-shadow:var(--shadow-card);
    color:var(--ink);
  }
  .invite--desktop{ width:264px; padding:18px 18px 16px; }
  .invite--nest{ width:208px; padding:14px 14px 12px; border-radius:15px; }

  .invite__title{
    margin:0;
    font-weight:600;
    color:var(--ink);
    letter-spacing:0;
  }
  .invite--desktop .invite__title{ font-size:19px; line-height:1.5; }
  .invite--nest .invite__title{ font-size:16px; line-height:1.5; }

  .invite__sub{ color:var(--muted); }
  .invite--desktop .invite__sub{ font-size:12.5px; line-height:1.65; margin:7px 0 14px; }
  .invite--nest .invite__sub{ font-size:11.5px; line-height:1.6; margin:5px 0 11px; }

  .btn{
    font-family:inherit;
    cursor:pointer;
    border:1px solid transparent;
    display:inline-flex; align-items:center; justify-content:center;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn:focus-visible{ outline:2px solid var(--sage-deep); outline-offset:2px; }
  .btn--primary{
    width:100%;
    background:var(--sage);
    color:var(--sage-ink);
    font-weight:600;
    border-radius:11px;
  }
  .invite--desktop .btn--primary{ height:38px; font-size:13px; }
  .invite--nest .btn--primary{ height:34px; font-size:12px; border-radius:9px; }
  .btn--primary:hover{ background:#7CA281; }

  .invite__secondary{
    display:flex; align-items:center; justify-content:center; gap:4px;
  }
  .invite--desktop .invite__secondary{ margin-top:10px; }
  .invite--nest .invite__secondary{ margin-top:8px; }

  .btn--secondary{
    background:transparent;
    border:1px solid var(--hairline-strong);
    color:var(--ink-2);
    border-radius:9px;
  }
  .invite--desktop .btn--secondary{ height:32px; padding:0 12px; font-size:12px; }
  .invite--nest .btn--secondary{ height:28px; padding:0 10px; font-size:11px; }
  .btn--secondary:hover{ background:var(--panel-2); }

  .btn--quiet{
    background:transparent; border:0;
    color:var(--muted); border-radius:9px;
  }
  .invite--desktop .btn--quiet{ height:32px; padding:0 10px; font-size:12px; }
  .invite--nest .btn--quiet{ height:28px; padding:0 8px; font-size:11px; }
  .btn--quiet:hover{ color:var(--ink-2); background:var(--panel-2); }

  .invite__dot{ color:var(--muted); opacity:.55; font-size:12px; line-height:1; }

  /* ---------- Size measure ---------- */
  .measure{ position:relative; }
  .measure__line{
    position:absolute; left:0; right:0; top:-15px; height:1px;
    border-top:1px dashed var(--hairline-strong);
  }
  .measure__line::before, .measure__line::after{
    content:""; position:absolute; top:-3px; width:1px; height:7px;
    background:var(--hairline-strong);
  }
  .measure__line::before{ left:0; }
  .measure__line::after{ right:0; }
  .measure__label{
    position:absolute; top:-29px; left:50%; transform:translateX(-50%);
    padding:0 6px;
    background:var(--ivory);
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:10px; letter-spacing:.02em;
    white-space:nowrap;
  }

  /* ---------- Nest room ---------- */
  .stage--room{
    width:100%; max-width:620px; height:352px;
    margin:0 auto;
  }
  .room-window{
    position:absolute; left:36px; top:28px; width:120px; height:86px;
    background:#FFFDF8; border:1px solid var(--hairline); border-radius:12px;
    box-shadow:inset 0 0 0 6px rgba(255,253,247,.55);
    z-index:0;
  }
  .room-floor{
    position:absolute; left:0; right:0; bottom:0; height:96px;
    background:var(--ivory-2); z-index:0;
  }
  .room-plant{
    position:absolute; left:40px; bottom:70px; width:34px; height:44px; z-index:1;
  }
  .room-nest{
    position:absolute; left:70px; bottom:34px; width:190px; height:56px;
    background:#EDE3D2; border-radius:50%;
    box-shadow:inset 0 6px 14px rgba(201,176,140,.30);
    z-index:2;
  }
  .room-card{ position:absolute; right:34px; top:66px; z-index:4; }

  /* ---------- Greeting tip ---------- */
  .tip{
    position:relative;
    background:var(--popover);
    border:1px solid var(--hairline);
    border-radius:11px;
    box-shadow:var(--shadow-tip);
    color:var(--ink);
    font-size:13px; line-height:1;
    padding:8px 14px;
    white-space:nowrap;
  }
  .tip::after{
    content:""; position:absolute; left:50%; bottom:-5px;
    width:9px; height:9px;
    background:var(--popover);
    border-right:1px solid var(--hairline);
    border-bottom:1px solid var(--hairline);
    transform:translateX(-50%) rotate(45deg);
  }

  .greet{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .greet-cell{
    position:relative; height:300px; overflow:hidden;
    background:var(--ivory);
    border:1px solid var(--hairline);
    border-radius:12px;
  }
  .greet-cell--room::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:70px;
    background:var(--ivory-2); z-index:0;
  }
  .greet-stack{
    position:relative; z-index:1;
    height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    gap:10px; padding:24px 18px 26px;
  }
  .greet-cap{
    position:absolute; left:14px; top:11px; z-index:2;
    font-family:var(--font-mono); font-size:10px; letter-spacing:.06em;
    color:var(--muted);
  }

  /* ---------- Dusk ---------- */
  .dusk-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .dusk-cell{ display:flex; flex-direction:column; gap:10px; }
  .dusk-cell .stage--desktop{ min-height:300px; padding:26px 20px; }
  .dusk-cell .greet-cell{ height:300px; }
  .dusk-cap{ font-family:var(--font-mono); font-size:10px; letter-spacing:.04em; color:var(--muted); }
  .dusk .invite{ box-shadow:var(--shadow-card); }

  /* ---------- Comparison ---------- */
  .compare{ display:flex; flex-direction:column; gap:14px; }
  .compare-cell{ display:flex; flex-direction:column; gap:8px; }
  .compare-scene{
    position:relative; height:340px; overflow:hidden;
    background:var(--ivory);
    border:1px solid var(--hairline);
    border-radius:12px;
  }
  .compare-scene .joey--cmp{ position:absolute; left:48px; bottom:46px; z-index:2; }
  .invite--old{
    position:absolute; right:48px; top:50%; transform:translateY(-50%); z-index:1;
    width:400px; padding:26px 28px 24px; border-radius:22px;
    box-shadow:0 26px 50px -22px rgba(63,58,53,.42), 0 4px 10px rgba(63,58,53,.08);
  }
  .invite--old .invite__title{ font-size:27px; line-height:1.4; }
  .invite--old .invite__sub{ font-size:14px; line-height:1.7; margin:9px 0 18px; }
  .invite--old .btn--primary{ height:50px; font-size:16px; border-radius:14px; }
  .invite--old .invite__secondary{ margin-top:12px; gap:10px; }
  .invite--old .btn--secondary{ height:40px; padding:0 16px; font-size:13px; border-radius:11px; }
  .invite--old .btn--quiet{ height:40px; padding:0 12px; font-size:13px; }
  .invite--new-cmp{
    position:absolute; right:48px; top:50%; transform:translateY(-50%); z-index:1; width:264px;
    padding:18px 18px 16px; border-radius:17px;
  }
  .invite--new-cmp .invite__title{ font-size:19px; line-height:1.5; }
  .invite--new-cmp .invite__sub{ font-size:12.5px; line-height:1.65; margin:7px 0 14px; }
  .invite--new-cmp .btn--primary{ height:38px; font-size:13px; border-radius:11px; }
  .invite--new-cmp .invite__secondary{ margin-top:10px; }
  .invite--new-cmp .btn--secondary{ height:32px; padding:0 12px; font-size:12px; }
  .invite--new-cmp .btn--quiet{ height:32px; padding:0 10px; font-size:12px; }

  .compare-label{
    margin:0 2px;
    display:flex; align-items:baseline; gap:10px;
    font-size:13px; font-weight:600; color:var(--ink);
  }
  .compare-label span{
    font-family:var(--font-mono); font-weight:400; font-size:11px; color:var(--muted);
  }

  .colophon{
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 24px;
    margin-top:28px; padding-top:16px;
    border-top:1px solid var(--hairline);
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:10.5px; letter-spacing:.03em;
  }

  @media (max-width:900px){
    .board{ padding:40px 22px 52px; }
    .frame{ padding:14px; }
    .greet, .dusk-grid{ grid-template-columns:1fr; }
    .compare-scene{
      height:auto; padding:22px 18px;
      display:flex; flex-direction:column; align-items:center; gap:18px;
    }
    .compare-scene .joey--cmp{ position:static; }
    .invite--old, .invite--new-cmp{
      position:static; transform:none; width:min(400px,100%);
    }
  }

  @media (max-width:640px){
    h1{ font-size:26px; }
    .dek{ font-size:14px; }
    .stage--desktop{ padding:26px 16px; gap:20px; }
    .scene-row{ gap:22px; }
    .stage--room{ height:auto; min-height:0; padding:20px; display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:center; gap:18px; }
    .room-window, .room-floor, .room-nest, .room-plant{ display:none; }
    .joey--nest, .room-card{ position:static; }
    .frame-note{ display:none; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<main class="board">
  <header>
    <p class="eyebrow">JoeyPet · 休息邀请 · 问候</p>
    <h1>一张小纸片，刚好靠在 Joey 旁边</h1>
    <p class="dek">同一套纸感语言，桌面与「家」两个尺度，加一条相配的问候提示。浅色为主，附暮色注记。</p>
    <ul class="keyline" aria-label="规格">
      <li><span>纸面</span><b>#FFFDF7</b></li>
      <li><span>发丝线</span><b>1px · 0.14</b></li>
      <li><span>圆角</span><b>17</b></li>
      <li><span>主按钮</span><b>#86A98A</b></li>
      <li><span>桌面卡宽</span><b>264 pt</b></li>
    </ul>
  </header>

  <section class="frames">

    <!-- A · 桌面邀请 -->
    <figure class="frame">
      <figcaption class="frame-head">
        <span class="frame-no">A</span>
        <span class="frame-title">桌面 · 休息邀请</span>
        <span class="frame-note">贴肩浮出、不遮脸、无蒙层</span>
      </figcaption>
      <div class="stage stage--desktop">
        <div class="scene-row">
          <svg class="joey joey--desktop" viewBox="0 0 320 400" role="img" aria-label="Joey 安静坐着"><use href="#joey-look" width="320" height="400"/></svg>
          <div class="measure">
            <span class="measure__line" aria-hidden="true"></span>
            <span class="measure__label">264 pt 宽</span>
            <article class="invite invite--desktop">
              <p class="invite__title">坐久啦，<br>我们一起伸个懒腰？</p>
              <button class="btn btn--primary" type="button">休息一下</button>
              <div class="invite__secondary">
                <button class="btn btn--secondary" type="button">稍后提醒</button>
                <span class="invite__dot" aria-hidden="true">·</span>
                <button class="btn btn--quiet" type="button">进入勿扰</button>
              </div>
            </article>
          </div>
        </div>
      </div>
      <p class="frame-legend">卡宽 264 · 约 1.57× Joey｜标题 19 / 正文 12.5｜主按钮 38，次按钮 32｜圆角 17、1px 发丝线、单张干净卡片。</p>
    </figure>
